name: chunky-fm

services:
  # The backend, and the database with it: chunky.fm's store is SQLite, opened
  # in-process by better-sqlite3, so there is no database server to run. What
  # would be a db container elsewhere is the `chunky_data` volume here — it
  # holds chunky.sqlite alongside the audio and artwork it refers to, and the
  # three have to stay together to mean anything.
  server:
    build:
      context: ./server
    image: chunky-fm/server:latest
    environment:
      # No longer required. Unset, the server falls back to the same code the
      # door uses, so one code opens both — see `loadConfig`. Set it here (or in
      # .env) to give the decks a password of their own.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional. Empty is *not* an open station any more — it falls back to the
      # code baked into the server, so a compose stack has a door on it out of
      # the box. Set this to choose your own; rotating it ends every invite.
      STATION_KEY: ${STATION_KEY:-}
      # `true` takes the door off. Nothing else does, and an explicit
      # STATION_KEY still wins over it — see .env.example.
      STATION_OPEN: ${STATION_OPEN:-}
      AUDIO_STORAGE_DIR: /data
      HOST: 0.0.0.0
      PORT: "3000"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-157286400}
      # nginx is in front of this, so every request arrives from the web
      # container's address. The sign-in throttle is keyed on the caller, and
      # would otherwise pace the whole internet as one — see server/.env.example.
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - chunky_data:/data
    ports:
      # Exposed so curl and the QA scripts can reach the API directly; the
      # browser never needs it, everything goes through the web service.
      # Host side stays off 3000 — see .env.example.
      - "${SERVER_PORT:-13000}:3000"
    restart: unless-stopped

  web:
    build:
      context: ./client
    image: chunky-fm/web:latest
    ports:
      - "${WEB_PORT:-18173}:80"
    depends_on:
      server:
        # nginx resolves the upstream lazily, but waiting for health means the
        # first page load already has an API behind it.
        condition: service_healthy
    restart: unless-stopped

volumes:
  chunky_data:
    name: chunky-fm_data

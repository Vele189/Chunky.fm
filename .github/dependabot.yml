version: 2

updates:
  # Two lockfiles, so two ecosystems entries — there is no root workspace to
  # cover both. Minor and patch bumps arrive grouped, because twelve separate
  # PRs a week for @types packages is how people stop reading the PRs. Majors
  # stay on their own: those are the ones worth looking at individually.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]

  # The workflow files pin actions by major tag; this is what moves those tags
  # when a new major lands, instead of them silently ageing out.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

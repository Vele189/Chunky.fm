<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chunky.fm — music wasn’t meant to be heard alone</title>
    <!-- The page in front of the station, and what the bare address answers
         with. It is a second document rather than a route inside the app so it
         can describe the station on the days the station's own bundle would
         have nothing to say. The station is at /listen; see nginx.conf, which
         serves this at `/` and sends an invite — `/?k=<key>`, which is what
         older links say — on to the app that can redeem it. -->
    <meta
      name="description"
      content="A live radio station where everyone hears the same second of the same song, chosen by one person on the decks. No skips, no shuffle, no algorithm — one room, listening together."
    />
    <!-- Same two vendored faces as the station, from the app's own origin. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
